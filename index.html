<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Poker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .user-tag { display: inline-block; padding: 5px 10px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>User Sync Screen</h1>
    <div id="user-container"></div>
    <hr>
    <input type="text" id="roomInput" placeholder="New Room">
    <input type="text" id="nameInput" placeholder="New Name">
    <button onclick="changeName()">Update Name</button>
    <br><br>

    <script>
        function changeName() {
        const nameInput = document.getElementById('nameInput');
        const roomInput = document.getElementById('roomInput');
        const newName = nameInput.value.trim();
        const newRoom = roomInput.value.trim();

        const reservedNames = ["GLOBAL_POT", "LAST_BET"];        
        if (reservedNames.includes(newName.toUpperCase())) {
            console.log("Invalid Name: This name is reserved for system use.");
            alert("That name is reserved. Please choose another name.");
            nameInput.value = "";
            return;
        }

        const currentParams = new URLSearchParams(window.location.search);
        const id = newName || currentParams.get('customId') || 'Anon';
        const room = newRoom || currentParams.get('roomId') || 'lobby';

        window.location.href = `room.html?roomId=${room}&customId=${id}`;
    }
    </script>
</body>
</html>
